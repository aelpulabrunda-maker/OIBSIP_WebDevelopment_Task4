<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Authentication</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:#0d2b5c;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    background:white;
    width:350px;
    padding:30px;
    border-radius:10px;
    text-align:center;
}
h1{
    color:#0d2b5c;
}
input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:5px;
    background:#1498ff;
    color:white;
    font-size:18px;
    cursor:pointer;
}
button:hover{
    background:#0b7dda;
}
#securePage{
    display:none;
    margin-top:20px;
    padding:20px;
    background:#eaf6ff;
    border-radius:8px;
    color:black;
}
</style>
</head>
<body>
<div class="container">
<h1>Login Page</h1>
<input type="text" id="username" placeholder="Enter Username">
<input type="password" id="password" placeholder="Enter Password">
<button onclick="login()">Login</button>
<div id="securePage">
<h2>Welcome User </h2>
<p>
You have successfully logged in.
</p>
</div>
</div>
<script>
function login(){
    let correctUsername = "admin";
    let correctPassword = "1234";
    let username =
    document.getElementById("username").value;
    let password =
    document.getElementById("password").value;
    if(username === correctUsername &&
       password === correctPassword){
        document.getElementById("securePage")
        .style.display = "block";
        alert("Login Successful");
    }
    else{
        alert("Invalid Username or Password");
    }
}
</script>
</body>
</html>
